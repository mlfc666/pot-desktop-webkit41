name: build-windows

# Same host image for all three MSVC targets; x86_64 is native, i686 and arm64
# are built with the matching MSVC toolset that ships in the windows-latest
# image (the same approach the upstream workflow used).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/build-windows.yml'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  build:
    name: windows-${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # Pinned on purpose: wl-clipboard-rs 0.8.1 (pulled in by arboard) does not
      # compile on newer compilers — `!` no longer implements FromIterator<()>
      # after the type-inference change tracked in rust-lang/rust#148922. 1.99.1
      # is the version the packages in the release were built and tested with.
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Record the toolchain
        run: rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}

      - name: Add the cross target
        if: matrix.arch != 'x64'
        # The windows-latest image already carries the MSVC toolsets for x86
        # and ARM64; a second rustup toolchain is not only unnecessary, it
        # fails to resolve `stable-<target>` for some targets.
        run: rustup target add ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm tauri build --target ${{ matrix.target }} --bundles nsis > /tmp/bundle.log 2>&1; then
            tail -n 40 /tmp/bundle.log
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -iE 'error|failed|cannot' /tmp/bundle.log | head -5 | cut -c1-400)
            cp /tmp/bundle.log bundle.log
            exit 1
          fi
          tail -n 10 /tmp/bundle.log

      - name: Keep the bundler log if the build broke
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-log-windows-${{ matrix.arch }}
          path: bundle.log
          if-no-files-found: ignore

      - name: Collect packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "src-tauri\target\${{ matrix.target }}\release\bundle\nsis\*.exe" artifacts\
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: pot-windows-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
