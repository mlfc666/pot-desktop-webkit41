name: build-linux

# Native builds on the distribution generation that still ships WebKitGTK 4.1:
# Ubuntu 24.04 on both x86_64 and arm64 runners. Nothing is cross-compiled and
# nothing runs under qemu, so the produced binaries link exactly the libraries
# of the runner image.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/build-linux.yml'
      - 'scripts/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            appimage: true
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            appimage: false # linuxdeploy/AppImage tooling has no reliable arm64 support
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK 4.1 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libsoup2.4-dev libayatana-appindicator3-dev librsvg2-dev \
            file imagemagick rpm squashfs-tools libfuse2t64

      - name: Point the removed 4.0 lookups at WebKitGTK 4.1
        run: bash scripts/setup-webkit41.sh

      - name: Expose the pkg-config shim
        run: echo "PKG_CONFIG_PATH=$PWD/.webkit41-shim" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend and RPM/AppImage bundles
        run: |
          bundles=rpm
          if [[ "${{ matrix.appimage }}" == "true" ]]; then bundles=rpm,appimage; fi
          pnpm tauri build --target ${{ matrix.target }} --bundles "$bundles"

      - name: Build the .deb with dpkg -S derived dependencies
        run: bash scripts/package-deb.sh --target ${{ matrix.target }}

      - name: Collect packages
        run: |
          mkdir -p artifacts
          cp target/deb/*.deb target/deb/*.sha256 artifacts/
          find src-tauri/target/${{ matrix.target }}/release/bundle -name '*.rpm' -exec cp {} artifacts/ \;
          if [[ "${{ matrix.appimage }}" == "true" ]]; then
            find src-tauri/target/${{ matrix.target }}/release/bundle -name '*.AppImage*' -exec cp {} artifacts/ \;
          fi
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pot-linux-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
