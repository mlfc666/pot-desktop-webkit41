name: build-macos

# One native runner per architecture: macos-15 is Apple Silicon, macos-13 is the
# last Intel image. No cross-compilation, so the DMGs carry binaries built by
# the toolchain that ships on that image.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/build-macos.yml'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  build:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            target: aarch64-apple-darwin
          - runner: macos-13
            arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # Pinned on purpose: wl-clipboard-rs 0.8.1 (pulled in by arboard) does not
      # compile on newer compilers — `!` no longer implements FromIterator<()>
      # after the type-inference change tracked in rust-lang/rust#148922. 1.99.1
      # is the version the packages in the release were built and tested with.
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Record the toolchain
        run: rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Unsigned on purpose. Passing empty APPLE_* variables makes Tauri 1 try
      # to codesign with an empty identity, which fails; a repository that has
      # the secrets should add them back together with the keychain import step.
      - name: Build DMG
        run: |
          set -o pipefail
          if ! pnpm tauri build --target ${{ matrix.target }} --bundles dmg > /tmp/bundle.log 2>&1; then
            tail -n 40 /tmp/bundle.log
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -iE 'error|failed|cannot' /tmp/bundle.log | head -5 | cut -c1-400)
            cp /tmp/bundle.log bundle.log
            exit 1
          fi
          tail -n 10 /tmp/bundle.log

      - name: Keep the bundler log if the build broke
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-log-macos-${{ matrix.arch }}
          path: bundle.log
          if-no-files-found: ignore

      - name: Collect packages
        run: |
          mkdir -p artifacts
          find src-tauri/target/${{ matrix.target }}/release/bundle -name '*.dmg' -exec cp {} artifacts/ \;
          shasum -a 256 artifacts/* > artifacts/SHA256SUMS-macos-${{ matrix.arch }}.txt
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pot-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
