name: build-macos

# One native runner per architecture: macos-15 is Apple Silicon, macos-13 is the
# last Intel image. No cross-compilation, so the DMGs carry binaries built by
# the toolchain that ships on that image.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/build-macos.yml'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

jobs:
  build:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            target: aarch64-apple-darwin
          - runner: macos-13
            arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # Pinned on purpose: wl-clipboard-rs 0.8.1 (pulled in by arboard) does not
      # compile on newer compilers — `!` no longer implements FromIterator<()>
      # after the type-inference change tracked in rust-lang/rust#148922. 1.99.1
      # is the version the packages in the release were built and tested with.
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Record the toolchain
        run: rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Signing and notarization stay off unless the repository defines the
      # secrets; an unsigned DMG is still usable locally (Gatekeeper requires
      # a right-click open on first launch).
      - name: Build DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Collect packages
        run: |
          mkdir -p artifacts
          find src-tauri/target/${{ matrix.target }}/release/bundle -name '*.dmg' -exec cp {} artifacts/ \;
          shasum -a 256 artifacts/* > artifacts/SHA256SUMS-macos-${{ matrix.arch }}.txt
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: pot-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
